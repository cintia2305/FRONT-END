<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark"> 
    <div class="container py-5">
        <h1 class="text-center mb-4 text-light">VESTIDOS MODERNOS</h1>
        <div class="row">
            
            <div class="col-md-4 mb-3">
                <div class="card">
                    <img src="Vestido Blue.jpg" class="card-img-top" alt="vestido">
                    <div class="card-body text-center">
                        <h5 class="card-title">Vestido</h5>
                        <h5 class="alert alert-info py-1" role="alert">R$500,00</h5>></h5>
                        
                        <div class="col-md-4 mb-3">
                             <div class="card">
                                <img src="vestido Yellow.jpg" class="card-img-top" alt="vestido">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Vestido</h5>
                                    <h5 class="alert alert-info py-1" role="alert">R$500,00</h5>></h5>
                        
                        <div class="col-md-4 mb-3">
                             <div class="card">
                                <img src="vestido Black.jpg" class="card-img-top" alt="vestido">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Vestido</h5>
                                    <h5 class="alert alert-info py-1" role="alert">R$500,00</h5>></h5>
                    </div>
                </div>
            </div>
        </div>


    </div>

        <form class="formLogin">
            
            <label>Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário" >

            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <button type="button" onclick="login()">Entrar</button>
            <p id="mensagem"></p>
        </form>
    </div>
<script src="script.js"></script>
</body>
</html>
